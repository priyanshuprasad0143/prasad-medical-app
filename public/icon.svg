<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Medical Cross Symbol -->
  <g transform="translate(256, 185)" fill="#ffffff" filter="url(#shadow)">
    <rect x="-30" y="-100" width="60" height="200" rx="16" />
    <rect x="-100" y="-30" width="200" height="60" rx="16" />
  </g>

  <!-- Pulse Line Graphic -->
  <path d="M 150 310 L 210 310 L 235 275 L 265 345 L 295 295 L 320 310 L 362 310" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Brand Name: PRASAD MEDICAL -->
  <text x="256" y="385" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="4" 
        text-anchor="middle">
    PRASAD
  </text>
  
  <text x="256" y="425" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="700" 
        fill="#ffe4e6" 
        letter-spacing="6" 
        text-anchor="middle">
    MEDICAL
  </text>
</svg>
